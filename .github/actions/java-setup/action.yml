name: Setup Java
description: Sets up Java.

inputs:
  distribution:
    description: Java distribution.
    required: false
    default: temurin
  java-version:
    description: The Java version that is going to be set up.
    required: false
    default: "25"

runs:
  using: composite
  steps:
    - id: setup-java
      name: Setup Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: ${{ inputs.distribution }}
        java-version: ${{ inputs.java-version }}

    # Every Maven invocation in this repository loads the mvn-lens core extension declared in
    # .mvn/extensions.xml, so the extension has to be resolved here, in the one step every job
    # running Maven goes through, rather than job by job. It needs the JDK set up above.
    - id: setup-mvn-lens
      name: Setup mvn-lens
      uses: ./.github/actions/mvn-lens-setup
